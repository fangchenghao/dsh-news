name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
          node --check desktop/runtime.mjs
          node --check desktop/skills/daily-ai-news/scripts/news.mjs
      - name: 单元测试（不联网，不需要 curl/git）
        run: npm test
