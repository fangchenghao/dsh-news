name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
      - name: 单元测试（不联网，不需要 curl/git）
        run: node --test test/host.test.mjs test/client.smoke.test.mjs
